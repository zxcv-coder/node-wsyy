<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>个人工作空间 | 数字化生活记录</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; color: #333; margin: 0; display: flex; justify-content: center; align-items: center; height: 100vh; }
        .container { background: white; padding: 2rem; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); text-align: center; max-width: 400px; }
        h1 { color: #2c3e50; font-size: 1.5rem; margin-bottom: 1rem; }
        p { line-height: 1.6; color: #666; font-size: 0.95rem; }
        .clock { font-size: 2rem; font-weight: bold; color: #3498db; margin: 1.5rem 0; }
        .footer { margin-top: 2rem; font-size: 0.8rem; color: #bdc3c7; }
    </style>
</head>
<body>
    <div class="container">
        <h1>我的数字化笔记本</h1>
        <p>欢迎来到我的个人静态展示空间。这里主要用于存储一些日常的学习笔记和自动化脚本运行结果。</p>
        <div class="clock" id="clock">00:00:00</div>
        <p>“自律始于细微之处。”</p>
        <div class="footer">© 2026 数字化工作空间 - 保持专注</div>
    </div>
    <script>
        function updateClock() {
            const now = new Date();
            const timeString = now.toLocaleTimeString();
            document.getElementById('clock').textContent = timeString;
        }
        setInterval(updateClock, 1000);
        updateClock();
    </script>
</body>
</html>
